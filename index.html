<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Lab</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <div id="start-screen" class="screen-content">
        <h1 class="main-title">Kelime <span>Lab</span></h1>
        <button id="start-button" onclick="startGame()" class="primary-btn">BAŞLA</button>
    </div>

    <div id="game-container" class="game-content" style="display: none;">
        <div class="topbar">
            <div class="stats">
                <span id="score">0 tamamlanan</span>
                <span id="percent">%0</span>
            </div>
            <button class="reset-small" onclick="resetGame()">Reiniciar progreso</button>
        </div>

        <div class="card">
            <h1 id="word">Cargando...</h1>
            <div id="dots"></div>
        </div>

        <div id="options" class="options-vertical"></div>
    </div>

    <script src="script.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="start-screen">
        <h1>KELİME<span>LAB</span></h1>
        
        <div id="button-container" style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <button id="start-button" class="option">BAŞLA</button>
            
            <button id="resume-button" class="option" style="display:none;">DEVAM ET</button>
        </div>
    </div>

    <div id="game-container" style="display:none;">
        <div class="header">
            <div class="stats">
                <span id="score">0 tamamlanan</span>
                <span id="percent">%0</span>
            </div>
            <button onclick="location.reload()" class="reset-btn">Menü</button>
        </div>

        <div class="card">
            <h2 id="word"></h2>
            <div id="dots" class="dots-container"></div>
        </div>

        <div id="options" class="options-grid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>

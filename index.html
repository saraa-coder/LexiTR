<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Lab</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: sans-serif;
        }

        .logo {
            font-size: 72px;
            font-weight: bold;
            margin-bottom: 40px; /* Espacio entre el logo y el botón */
        }

        .kelime {
            color: #2d3e50;
        }

        .lab {
            color: #4caf50;
            margin-left: 5px;
        }

        .btn-empezar {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #4caf50;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .btn-empezar:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="logo">
        <span class="kelime">Kelime</span><span class="lab">Lab</span>
    </div>

    <a href="#empezar" class="btn-empezar">Empezar</a>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Lab - Turco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="start-screen" class="screen">
        <div class="logo-container">
            <h1>KELİME<span>LAB</span></h1>
            <p>Laboratorio de Vocabulario Turco</p>
        </div>
        <div class="button-group">
            <button id="start-button" class="btn-main">BAŞLA</button>
            <button id="resume-button" class="btn-sub" style="display:none;">DEVAM ET</button>
        </div>
    </div>

    <div id="game-container" class="screen" style="display:none;">
        <div class="header">
            <div class="stats">
                <span id="score">0 tamamlanan</span>
                <span id="percent">%0</span>
            </div>
            <button onclick="resetGame()" class="reset-btn">Sıfırla</button>
        </div>

        <div class="card">
            <h2 id="word">Cargando...</h2>
            <div id="dots" class="dots-container">
                </div>
        </div>

        <div id="options" class="options-grid">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
